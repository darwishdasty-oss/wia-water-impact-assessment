name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: |
          grep -q "flutter_lints" pubspec.yaml || flutter pub add --dev flutter_lints
          flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings

      - name: Run unit tests
        run: flutter test
